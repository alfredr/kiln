[package]
name = "kiln-doc"
version = "0.1.0"
edition = "2024"

[features]
default = ["syntax-highlight"]
syntax-highlight = ["dep:syntect"]

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
syntect = { version = "5", optional = true, default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-onig"] }
